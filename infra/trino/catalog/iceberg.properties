connector.name=iceberg
connector.class=Iceberg

# Iceberg REST catalog via PostgreSQL JDBC
iceberg.catalog.type=jdbc
iceberg.catalog.uri=jdbc:postgresql://${ENV:POSTGRES_HOST:postgres}:${ENV:POSTGRES_PORT:5432}/${ENV:POSTGRES_DB:document_db}
iceberg.catalog.jdbc.user=${ENV:POSTGRES_USER:admin}
iceberg.catalog.jdbc.password=${ENV:POSTGRES_PASSWORD:password123}
iceberg.catalog.jdbc.driver=org.postgresql.Driver
iceberg.catalog.warehouse=${ENV:ICEBERG_WAREHOUSE:s3a://documents/warehouse}

# S3 / MinIO file IO
iceberg.catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
iceberg.catalog.s3.endpoint=http://${ENV:MINIO_ENDPOINT:minio:9000}
iceberg.catalog.s3.access-key-id=${ENV:MINIO_ACCESS_KEY:admin}
iceberg.catalog.s3.secret-access-key=${ENV:MINIO_SECRET_KEY:password123}
iceberg.catalog.s3.path-style-access=true
iceberg.catalog.s3.region=us-east-1

version: '3.8'

services:
  # --- INFRASTRUCTURE LAYER (Hạ tầng lưu trữ & Database) ---
  
  milvus-minio:
    image: minio/minio:latest
    container_name: bd_legal_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - milvus_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - bigdata_internal
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: bd_legal_etcd
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=1
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd --advertise-client-urls http://bd_legal_etcd:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd_data:/etcd
    networks:
      - bigdata_internal
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.4.4
    container_name: bd_legal_milvus
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: bd_legal_etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: admin
      MINIO_SECRET_ACCESS_KEY: password123
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: aiedu-milvus
    depends_on:
      - milvus-etcd
      - milvus-minio
    volumes:
      - milvus_vector_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - bigdata_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- BIG DATA LAYER (Kafka & Spark) ---

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: bd_legal_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bigdata_internal
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: bd_legal_kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: bd_legal_zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://bd_legal_kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - zookeeper
    networks:
      - bigdata_internal
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: bd_legal_kafdrop
    ports:
      - "9002:9000"
    environment:
      KAFKA_BROKERCONNECT: bd_legal_kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - bigdata_internal
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.1
    container_name: bd-legal-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    networks:
      - bigdata_internal
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.1
    container_name: bd-legal-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://bd-legal-spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    networks:
      - bigdata_internal
    restart: unless-stopped

  spark-streaming-ingest:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: bd-legal-spark-ingest
    command: python3 services/spark-worker/streaming_ingest.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=bd_legal_kafka:9092
      - KAFKA_TOPIC=legal_documents
      - MILVUS_HOST=bd_legal_milvus
      - MILVUS_PORT=19530
      - SPARK_MASTER=spark://bd-legal-spark-master:7077
    volumes:
      - .:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      kafka:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      spark-master:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - bigdata_internal
    restart: unless-stopped

  # --- APPLICATION LAYER (Mã nguồn AI & API) ---

  google-mock:
    image: python:3.10-slim
    container_name: bd_legal_mock_server
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install fastapi uvicorn && python3 mock_google_server.py"
    ports:
      - "9005:9000"
    networks:
      - bigdata_internal
    restart: unless-stopped

  ai-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: bd_legal_ai_engine
    command: python3 services/ai-rag-engine/main.py
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION=vi_legal_rag
      - TRANSFORMERS_OFFLINE=1
      - OLLAMA_URL=http://heritage_ollama:11434
      - OLLAMA_MODEL=legal-rag-finetuned
      - DEFAULT_GOOGLE_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_URL=${GEMINI_API_URL}
      - GOOGLE_MODEL=gemini-2.0-flash
      - MAX_CONCURRENT=20
      - TOP_K=10
    volumes:
      - .:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      milvus-standalone:
        condition: service_healthy
      google-mock:
        condition: service_started
    networks:
      - bigdata_internal
      - heritage_network
    restart: unless-stopped

  core-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: bd_legal_core_api
    command: python3 services/core-api/main.py
    ports:
      - "8003:8001"
    environment:
      - AI_ENGINE_URL=http://bd_legal_ai_engine:8002
    volumes:
      - .:/app
    depends_on:
      - ai-engine
    networks:
      - bigdata_internal
      - heritage_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bd_legal_frontend
    ports:
      - "8080:8080"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8003
    networks:
      - bigdata_internal
      - heritage_network
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

networks:
  bigdata_internal:
    driver: bridge
  heritage_network:
    external: true
    name: han_nom_model_default

volumes:
  milvus_minio_data:
    external: true
    name: infra_minio_data
  milvus_etcd_data:
    external: true
    name: infra_etcd_data
  milvus_vector_data:
    external: true
    name: infra_milvus_data

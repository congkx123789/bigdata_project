version: '3.8'

services:
  # --- INFRASTRUCTURE LAYER ---
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - internal
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=1
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - internal
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.3.15
    container_name: milvus-standalone
    command: [ "milvus", "run", "standalone" ]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: admin
      MINIO_SECRET_ACCESS_KEY: password123
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: aiedu-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - ./data/milvus:/var/lib/milvus
    networks:
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: document_db
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - internal
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - internal
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - internal
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/document_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password123
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "edge"
      KC_HOSTNAME_DEBUG: "true"
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    command: start-dev
    networks:
      - internal
    restart: unless-stopped

  # --- APPLICATION LAYER ---
  google-mock:
    image: python:3.10-slim
    container_name: bd_legal_mock_server
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install fastapi uvicorn && python3 mock_google_server.py"
    ports:
      - "9005:9000"
    networks:
      - internal
    restart: unless-stopped

  ai-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: bd_legal_ai_engine
    command: python3 services/ai-rag-engine/main.py
    environment:
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - TRANSFORMERS_OFFLINE=0
      - DEFAULT_GOOGLE_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_URL=${GEMINI_API_URL}
      - EMBED_DEVICE=cpu
      - MAX_CONCURRENT=5
    volumes:
      - .:/app
      - ./data/hf_cache:/root/.cache/huggingface
    depends_on:
      - milvus
      - google-mock
    networks:
      - internal
    restart: unless-stopped

  core-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: bd_legal_core_api
    command: python3 services/core-api/main.py
    ports:
      - "8003:8001"
    environment:
      - AI_ENGINE_URL=http://ai-engine:8002
    volumes:
      - .:/app
    depends_on:
      - ai-engine
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bd_legal_frontend
    ports:
      - "8080:8080"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8003
    networks:
      - internal
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

networks:
  internal:
    driver: bridge

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'core-api'
    static_configs:
      - targets: ['bd_legal_core_api:8001']

  - job_name: 'ai-engine'
    static_configs:
      - targets: ['bd_legal_ai_engine:8002']

  - job_name: 'milvus'
    static_configs:
      - targets: ['bd_legal_milvus:9091']
